# Extraction mensuelle des bornes OpenStreetMap de Belgique, sans Overpass (extrait Geofabrik).
# À placer dans le dépôt public par P.F. (rien n'est poussé par Claude). Données : © contributeurs OpenStreetMap, ODbL.
name: maj-osm
on:
  schedule: [{cron: "17 4 3 * *"}]     # le 3 de chaque mois, 04 h 17 UTC
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  extraire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: curl -fsSL -o belgium.osm.pbf https://download.geofabrik.de/europe/belgium-latest.osm.pbf
      - run: osmium tags-filter belgium.osm.pbf nwr/amenity=charging_station -o bornes.osm.pbf
      - run: osmium export bornes.osm.pbf -f geojsonseq --add-unique-id=type_id -o bornes.geojsonl --overwrite
      - run: python3 maj/extract_bornes_osm.py --geojsonseq bornes.geojsonl data/bornes-be-osm.json data/meta.json
      - run: |
          git config user.name "maj-osm"; git config user.email "noreply@users.noreply.github.com"
          git add data/bornes-be-osm.json data/meta.json
          git diff --cached --quiet || git commit -m "Liste OSM Belgique : extraction mensuelle" && git push
