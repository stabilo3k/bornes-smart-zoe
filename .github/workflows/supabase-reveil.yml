# Réveil du serveur Supabase (offre gratuite : mise en pause après 7 jours sans activité). Aucune donnée n'est enregistrée.
# La clé ci-dessous est la clé PUBLIABLE de l'application (publique par conception ; l'accès est limité par les règles de la base).
name: supabase-reveil
on:
  schedule:
    - cron: "23 6 * * 1,4"   # lundi et jeudi, 06:23 UTC
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  reveil:
    runs-on: ubuntu-latest
    env:
      URL: https://evvoufjrzejumdpjgoek.supabase.co
      KEY: sb_publishable_phgSpnbZ0xQSz93hzalZ9A_mWcgPrmx
    steps:
      - name: Interroger les quatre tables (échoue si le serveur ne répond pas)
        run: |
          set -euo pipefail
          for t in releves etats pastilles fiches; do
            n=$(curl -fsS --retry 3 --max-time 60 -D - -o /dev/null -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Prefer: count=exact" -H "Range: 0-0" "$URL/rest/v1/$t?select=client_id" | grep -i '^content-range' | tr -d '\r')
            echo "$t : $n"
          done
      - name: Détection d'anomalies d'écriture (échoue si un seuil est dépassé)
        run: |
          set -euo pipefail
          a=$(curl -fsS --retry 3 --max-time 60 -X POST -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' "$URL/rest/v1/rpc/anomalies")
          echo "$a"
          # Seuils d'alerte (inférieurs aux plafonds du serveur) : une alerte signale un pic à examiner, jamais une preuve d'abus.
          ko=$(echo "$a" | jq -r '[
            (if .releves_1h >= 400 then "relevés/h \(.releves_1h)" else empty end),
            (if .pastilles_1h >= 200 then "pastilles/h \(.pastilles_1h)" else empty end),
            (if .fiches_1h >= 150 then "fiches/h \(.fiches_1h)" else empty end),
            (if .borne_max_releves_24h >= 25 then "relevés sur une borne/24h \(.borne_max_releves_24h)" else empty end),
            (if .borne_max_pastilles_24h >= 25 then "pastilles sur une borne/24h \(.borne_max_pastilles_24h)" else empty end),
            (if .telephone_max_releves_24h >= 35 then "relevés d un téléphone/24h \(.telephone_max_releves_24h)" else empty end),
            (if .telephones_neufs_24h >= 80 then "téléphones neufs/24h \(.telephones_neufs_24h)" else empty end)
          ] | join(" ; ")')
          if [ -n "$ko" ]; then echo "::error::Anomalie : $ko (voir la procédure de purge dans docs/SUPABASE-MAJ-1.3.2-anti-abus.sql du dépôt privé)"; exit 1; fi
          echo "Aucune anomalie."
