# Archive cumulative et anonyme des relevés, fiches et pastilles du serveur (colonnes publiques, jamais « device »), pour qu'ils
# survivent à la purge de 3 ans du serveur. Chaque dimanche ; ajout seul ; ne touche pas à app/.
name: archive-communaute
on:
  schedule:
    - cron: "47 5 * * 0"   # dimanche, 05:47 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Archiver
        id: arch
        run: |
          set +e
          python3 -I maj/archiver_communaute.py
          c=$?
          echo "code=$c" >> "$GITHUB_OUTPUT"
          # code 3 = des lignes écartées : on publie quand même l'archive, puis l'étape « Alerte » échoue ; tout autre code non nul arrête tout
          if [ "$c" != "0" ] && [ "$c" != "3" ]; then exit "$c"; fi
      - name: Publier si changement
        run: |
          set -euo pipefail
          git config user.name "archive-communaute"
          git config user.email "actions@users.noreply.github.com"
          git add data/archive-communaute
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Archive communautaire : mise à jour automatique (données publiques, sans identifiant de téléphone)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Alerte si des lignes ont été écartées
        if: steps.arch.outputs.code == '3'
        run: |
          echo "::error::Des lignes du serveur ont été écartées de l'archive (forme invalide) : aligner valide() sur les contraintes du serveur (maj/archiver_communaute.py)."
          exit 1
